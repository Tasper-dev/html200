<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rolodex Card</title>
    <link href="css/styles.css" rel="stylesheet" />
    <script
      src="https://kit.fontawesome.com/fab87b9ac1.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <article class="container">
      <div class="img-box">
        <img src="images/instructor-bio-image3.png" alt="smiling man" />
        <h1>Steve Smith</h1>
        <h2>Project Manager</h2>
      </div>
      <div class="info-box">
        <ul>
          <li><span class="bold">Company:</span> Front End Dev Co</li>
          <li><span class="bold">Experience:</span> 3 years</li>
          <li><span class="bold">School:</span> UW</li>
          <li><span class="bold">Major:</span> Marketing</li>
          <li><span class="bold">Email:</span> steve@marketing.com</li>
          <li>
            <i class="fa-brands fa-linkedin"></i>steve@linkedinprofile.com
          </li>
        </ul>
      </div>
    </article>
  </body>
</html>
